site_name: My Engineering Notebook
theme:
  name: material
  features:
    - navigation.tabs
    - content.code.copy
  palette: 
    scheme: default
    primary: teal

# Essential for DSA code snippets
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
